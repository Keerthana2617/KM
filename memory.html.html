<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Our Day… #KM 💖</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}

/* 📸 SLIDES */
.slide {
  display: none;
  position: absolute;
  width: 100%;
  height: 100vh;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ACTIVE */
.active {
  display: block;
}

/* 🔘 NAV */
.nav {
  position: absolute;
  top: 50%;
  width: 100%;
  display: flex;
  justify-content: space-between;
  z-index: 10;
}

.nav button {
  font-size: 30px;
  background: rgba(0,0,0,0.5);
  color: white;
  border: none;
  padding: 10px;
  cursor: pointer;
}

/* ❗ DEBUG (shows if image missing) */
.error {
  color: white;
  position: absolute;
  top: 50%;
  width: 100%;
  text-align: center;
}
</style>
</head>

<body>

<!-- 📸 SLIDES -->
<div class="slide active"><img src="./img1.jpg" onerror="showError(1)"></div>
<div class="slide"><img src="./img2.jpg" onerror="showError(2)"></div>
<div class="slide"><img src="./img3.jpg" onerror="showError(3)"></div>
<div class="slide"><img src="./img4.jpg" onerror="showError(4)"></div>
<div class="slide"><img src="./img5.jpg" onerror="showError(5)"></div>
<div class="slide"><img src="./img6.jpg" onerror="showError(6)"></div>
<div class="slide"><img src="./img7.jpg" onerror="showError(7)"></div>
<div class="slide"><img src="./img8.jpg" onerror="showError(8)"></div>

<!-- 🔘 NAV -->
<div class="nav">
  <button onclick="prev()">❮</button>
  <button onclick="next()">❯</button>
</div>

<!-- ❗ ERROR MESSAGE -->
<div id="error" class="error"></div>

<script>
let slides = document.querySelectorAll(".slide");
let index = 0;

/* SHOW SLIDE */
function showSlide(i) {
  slides.forEach(s => s.classList.remove("active"));
  slides[i].classList.add("active");
}

/* NEXT */
function next() {
  index++;
  if(index >= slides.length) index = 0;
  showSlide(index);
}

/* PREVIOUS */
function prev() {
  index--;
  if(index < 0) index = slides.length - 1;
  showSlide(index);
}

/* AUTO SLIDE */
setInterval(next, 3000);

/* ERROR HANDLER */
function showError(num){
  document.getElementById("error").innerText =
    "Image img" + num + ".jpg not found ❌";
}
</script>

</body>
</html>
